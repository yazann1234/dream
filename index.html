<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b36">
<title>رحلتك نحو الفاينل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=El+Messiri:wght@500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--bg2:#e8ecf5;--card:#fff;--tx:#121a2e;--mu:#68748c;--ln:#e2e7f0;--hero1:#0f1a35;--hero2:#1e2f5c;--bad:#d4573f;--ok:#1fa597;--ch:#4f8cff;--md:#e0567c;--en:#1fa597;--sk:#8b6cf0;--ac:#c9a24f;--sh:0 12px 32px -16px rgba(16,27,54,.25);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1a;--bg2:#101a2e;--card:#0f1829;--tx:#e8edf7;--mu:#8e9bb5;--ln:#1e2a44;--hero1:#0c1630;--hero2:#1a2a52;--sh:0 12px 32px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d1a;--bg2:#101a2e;--card:#0f1829;--tx:#e8edf7;--mu:#8e9bb5;--ln:#1e2a44;--hero1:#0c1630;--hero2:#1a2a52;--sh:0 12px 32px -16px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(60% 40% at 100% 0%,color-mix(in srgb,var(--ac) 10%,transparent),transparent 70%),radial-gradient(50% 35% at 0% 30%,color-mix(in srgb,var(--ch) 7%,transparent),transparent 70%);background-attachment:fixed;color:var(--tx);font-family:"Readex Pro",Tahoma,system-ui,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.w{max-width:780px;margin:auto;padding:0 16px 130px}
/* top bar */
.top{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;padding:12px 16px;margin:0 -16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 75%,transparent)}
.brand{flex:1;font:700 20px "El Messiri",serif;display:flex;align-items:center;gap:8px}
.brand i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#000));display:grid;place-items:center;font-style:normal;font-size:15px}
.tb{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:.2s}
.tb:hover{border-color:var(--ac);color:var(--ac)}
.kbd{font-size:11px;border:1px solid var(--ln);border-radius:6px;padding:0 5px;color:var(--mu)}
.srchbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--mu);cursor:pointer;font-size:14px}
@media (max-width:520px){.srchbtn span,.srchbtn .kbd{display:none}}
/* hero */
.hero{position:relative;overflow:hidden;color:#f3efe6;border-radius:28px;padding:22px 20px 18px;margin:4px 0 16px;background:radial-gradient(110% 80% at 100% 0%,color-mix(in srgb,var(--ac) 40%,transparent),transparent 55%),radial-gradient(80% 80% at 0% 100%,rgba(79,140,255,.28),transparent 60%),linear-gradient(160deg,var(--hero1),var(--hero2));box-shadow:0 20px 40px -20px rgba(15,26,53,.6)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);background-size:250% 100%;animation:sh 7s linear infinite;pointer-events:none}
@keyframes sh{from{background-position:150% 0}to{background-position:-100% 0}}
.hg{display:flex;align-items:center;gap:16px;position:relative;z-index:1}.hl{flex:1;min-width:0}
.gr{font-size:14px;opacity:.8}
#nm{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.3);color:#fff;font:700 27px "El Messiri",serif;width:100%;padding:0;outline:0}
#nm::placeholder{color:rgba(255,255,255,.45)}#nm:focus{border-bottom-color:var(--ac)}
.lvr{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.lv{font-size:12.5px;color:#14213d;background:var(--ac);border-radius:20px;padding:1px 12px;font-weight:700}
.lvn{font-size:12.5px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:0 10px}
.xp{height:7px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:10px;overflow:hidden}
.xp i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),#ffe7a8);transition:width .6s}
.xps{font-size:12px;opacity:.75}
.ring{flex:none;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ac) 45%,transparent))}
.ring circle:last-of-type{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ms{margin:12px 0 0;font-size:14px;opacity:.9;position:relative;z-index:1}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.st div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:8px 2px;text-align:center;font-size:11.5px}
.st b{display:block;font:700 22px "Readex Pro",sans-serif;color:var(--ac);line-height:1.3}
/* cards */
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh);animation:up .4s both}
@keyframes up{from{transform:translateY(8px)}}
.ch2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
h2{font:700 19px "El Messiri",serif;margin:0}
.pill{font-size:12.5px;font-weight:700;border-radius:20px;padding:1px 10px;background:var(--bg2);color:var(--mu)}
.mu{color:var(--mu);font-size:14px;margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2>.card{margin:0}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.grid2+.card,.grid2+*{margin-top:14px}
.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.pr{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qt{font:400 20px/1.9 Amiri,serif;margin:0 0 6px}
/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.cd div{text-align:center;border-radius:16px;padding:8px 0;background:color-mix(in srgb,var(--evc) 10%,transparent);border:1px solid color-mix(in srgb,var(--evc) 30%,transparent);font-size:12px;color:var(--mu)}
.cd b{display:block;font:700 26px "Readex Pro",sans-serif;color:var(--evc);font-variant-numeric:tabular-nums;line-height:1.3}
.evs{display:flex;gap:8px;flex-wrap:wrap}
.ev{font-size:12.5px;border-radius:12px;padding:3px 10px;border:1px solid var(--ln);display:flex;gap:6px;align-items:center}
.ev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--evc)}
.ev.past{opacity:.45;text-decoration:line-through}
/* tasks */
.tk{display:flex;align-items:center;gap:4px;border-radius:14px;background:color-mix(in srgb,var(--c) 7%,transparent);margin:6px 0;padding-inline-end:4px;border-inline-start:4px solid var(--c);transition:.2s;position:relative}
.tk label{flex:1;display:flex;gap:10px;align-items:center;padding:9px 10px;cursor:pointer;font-size:15px;min-width:0}
.tk input{position:absolute;opacity:0;pointer-events:none}
.cb{width:23px;height:23px;border-radius:8px;border:2px solid var(--c);flex:none;display:grid;place-items:center;transition:.2s;background:var(--card)}
.tk input:checked+.cb{background:var(--c);animation:pop .35s}
.tk input:checked+.cb::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.tk input:focus-visible+.cb{outline:2px solid var(--ac);outline-offset:2px}
@keyframes pop{50%{transform:scale(1.25)}}
.tk.dn .tt{text-decoration:line-through;color:var(--mu)}
.tk.dn{opacity:.75}
.tt{overflow-wrap:anywhere}
.mvd{display:inline-block;font-size:11px;color:var(--mu);background:var(--bg2);border-radius:8px;padding:0 6px;margin-inline-start:4px}
.ta{display:flex;gap:2px;opacity:.6;transition:.2s}.tk:hover .ta{opacity:1}
.ib{width:30px;height:30px;border-radius:10px;border:0;background:transparent;color:var(--mu);cursor:pointer;font-size:16px;display:grid;place-items:center}
.ib:hover{background:var(--bg2);color:var(--tx)}
mark{background:color-mix(in srgb,var(--ac) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.minibar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-bottom:6px}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));border-radius:6px;transition:width .5s}
.add{display:flex;gap:6px;margin-top:10px}
.add input,.add select,.inp{border:1px solid var(--ln);border-radius:12px;background:var(--bg);padding:8px 12px;font-size:14px;outline:0;min-width:0}
.add input{flex:1}.add input:focus,.inp:focus,textarea:focus{border-color:var(--ac)}
.add button{width:42px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-size:22px;cursor:pointer}
textarea{width:100%;min-height:70px;margin-top:10px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);font-size:14px;padding:10px 12px;resize:vertical;outline:0}
.mood{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13.5px;color:var(--mu);flex-wrap:wrap}
.mood button{font-size:22px;width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;filter:grayscale(1);opacity:.55;transition:.2s}
.mood button:hover{opacity:1;filter:none}
.mood button.on{filter:none;opacity:1;border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);transform:scale(1.08)}
.warn{border-color:color-mix(in srgb,var(--bad) 45%,var(--ln));background:linear-gradient(0deg,color-mix(in srgb,var(--bad) 6%,var(--card)),var(--card))}
/* plan */
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:14px;background:var(--card);padding:0 12px;margin-bottom:10px}
.srch input{flex:1;border:0;background:transparent;padding:11px 0;outline:0;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}
.chips button{border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 4px;cursor:pointer;font-size:14px;color:var(--mu);font-weight:500}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:700}
.wk{margin:22px 4px 8px;font:700 17px "El Messiri",serif;color:var(--ac);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note{font:600 11.5px "Readex Pro",sans-serif;background:var(--ac);color:#fff;padding:1px 10px;border-radius:12px}
.day{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:10px 12px;margin-bottom:10px;scroll-margin-top:80px}
.day.today{border:2px solid var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 12%,transparent)}
.day.done{opacity:.65}
.day.flash{animation:fla 1.4s}
@keyframes fla{30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 40%,transparent)}}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.dh span{color:var(--mu);font-weight:400;font-size:13px;display:flex;align-items:center;gap:4px}
.tag{font-size:11px;border-radius:8px;padding:0 7px;margin-inline-start:6px;font-weight:700;background:var(--bad);color:#fff}
.tag.t{background:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
/* stats */
.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
@media (max-width:480px){.subs{grid-template-columns:repeat(2,1fr)}}
.subs div{font-size:12.5px;color:var(--mu)}
.subs svg{display:block;margin:0 auto 2px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hm span{font-size:11px;text-align:center;color:var(--mu)}
.hm i{aspect-ratio:1;border-radius:7px;background:var(--bg2);display:grid;place-items:center;font-style:normal;font-size:10.5px;color:var(--mu);cursor:pointer;transition:.15s}
.hm i:hover{transform:scale(1.12)}
.hm i.l1{background:color-mix(in srgb,var(--ok) 25%,var(--bg2))}.hm i.l2{background:color-mix(in srgb,var(--ok) 50%,var(--bg2));color:#fff}.hm i.l3{background:color-mix(in srgb,var(--ok) 75%,var(--bg2));color:#fff}.hm i.l4{background:var(--ok);color:#fff}
.hm i.fu{opacity:.45}.hm i.td{outline:2px solid var(--ac);outline-offset:1px}.hm i.no{visibility:hidden}
.lg{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:11px;color:var(--mu);margin-top:8px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.wc{display:flex;gap:8px;height:120px;align-items:flex-end}
.wc>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mu);gap:2px}
.wc i{width:100%;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 55%,transparent));border-radius:10px 10px 4px 4px;min-height:4px;transition:height .6s}
.wc i.cur{background:linear-gradient(180deg,var(--ok),color-mix(in srgb,var(--ok) 55%,transparent))}
.sb{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:9px 0}
.sb span:first-child{width:96px;flex:none}
.bar{flex:1;height:9px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
.sb em{min-width:44px;text-align:left;font-style:normal;color:var(--mu);font-size:12.5px}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.bd{grid-template-columns:repeat(3,1fr)}}
.bd div{text-align:center;font-size:11.5px;padding:10px 2px;border-radius:16px;border:1px solid var(--ln);color:var(--mu);line-height:1.35;filter:grayscale(1);opacity:.45}
.bd div.on{opacity:1;filter:none;color:var(--tx);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.bd b{display:block;font-size:24px;margin-bottom:2px}
.big{font:700 30px "Readex Pro",sans-serif;color:var(--ac);line-height:1.2}
/* focus */
.fc{text-align:center}
.tring{position:relative;width:min(290px,78vw);margin:10px auto}
.tring svg{width:100%;height:auto;display:block}
.tring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#tmT{font:700 clamp(44px,14vw,62px) "Readex Pro",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1}
#tmM{font-size:14px;color:var(--mu)}
#tmR{transition:stroke-dashoffset .3s linear}
.ctl{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
.ctl .btn{min-width:88px}
.ctl .go{min-width:130px;font-size:16px;padding:10px 18px;border-radius:16px}
/* nav */
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--ln);box-shadow:0 14px 34px -12px rgba(0,0,0,.35);margin-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;color:var(--mu);border-radius:16px;padding:7px 14px;cursor:pointer;font-size:11.5px;min-width:68px;transition:.2s}
.nav button.on{background:var(--tx);color:var(--bg)}
#mini{position:fixed;top:66px;left:16px;z-index:24;display:none;align-items:center;gap:6px;border-radius:20px;border:1px solid var(--ac);background:var(--card);color:var(--tx);padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;box-shadow:var(--sh)}
#mini.on{display:flex}
#mini .pd{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pu 1.4s infinite}
@keyframes pu{50%{opacity:.25}}
/* toast */
#ts{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--tx);color:var(--bg);padding:9px 10px 9px 18px;border-radius:16px;opacity:0;transition:.3s;pointer-events:none;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#ts.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#ts button{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:4px 12px;font-weight:700;cursor:pointer}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.5);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:70px 14px 14px}
.ov.on{display:flex}
.pnl{width:100%;max-width:560px;background:var(--card);border:1px solid var(--ln);border-radius:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);overflow:hidden;animation:up .25s both;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.pnl .srch{border:0;border-bottom:1px solid var(--ln);border-radius:0;margin:0}
#pl{overflow:auto;padding:6px}
#pl button{display:flex;width:100%;gap:10px;align-items:center;text-align:start;border:0;background:transparent;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:14.5px}
#pl button.sel{background:var(--bg2)}
#pl small{color:var(--mu);margin-inline-start:auto;font-size:12px;white-space:nowrap}
#pl h6{margin:8px 12px 2px;font-size:12px;color:var(--mu);font-weight:500}
.setb{overflow:auto;padding:18px}
.setb h3{font-size:14px;margin:16px 0 8px;color:var(--mu);font-weight:700}
.setb h3:first-child{margin-top:0}
.sw{display:flex;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);outline:2px solid transparent;cursor:pointer}
.sw button.on{outline-color:var(--tx)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:14.5px}
.kb{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;color:var(--mu)}
#zen{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(70% 60% at 50% 40%,var(--hero2),var(--hero1));color:#f3efe6;cursor:pointer}
#zen.on{display:flex}
#zenT{font:700 clamp(80px,22vw,180px) "Readex Pro",sans-serif;font-variant-numeric:tabular-nums;line-height:1}
#zen small{opacity:.6}
#zenQ{font:400 22px Amiri,serif;opacity:.8;max-width:600px;text-align:center;padding:0 20px}
/* ===== ambient background ===== */
body::before,body::after{content:"";position:fixed;z-index:-1;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.16;pointer-events:none;animation:blob 26s ease-in-out infinite alternate}
body::before{background:var(--ac);top:-18vmax;right:-14vmax}
body::after{background:#5b63e0;bottom:-20vmax;left:-16vmax;animation-delay:-13s}
@keyframes blob{to{transform:translate(-8vmax,10vmax) scale(1.15)}}
/* ===== planner ===== */
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:10px 0}
.pf label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mu);font-weight:500}
.pf .inp{width:100%;font-size:15px;font-weight:700;color:var(--tx);text-align:center;padding:8px}
.pf.cust{background:var(--bg2);border-radius:16px;padding:12px;margin:0 0 12px;text-align:start}

function build(){
  T=D.map(()=>[]);
  D.forEach((ts,i)=>ts.forEach((t,j)=>{const id=i+"_"+j,to=MV[id]!==undefined&&T[MV[id]]?MV[id]:i;T[to].push({id,t,s:sub(t),o:i})}));
  for(const k in CU)(CU[k]||[]).forEach(c=>{if(T[+k])T[+k].push({id:c.id,t:c.t,s:c.s,o:+k,cu:1})});
}
const full=i=>T[i].every(x=>S[x.id]);

function calc(){
  build();
  const t0=day0(),idx=Math.round((t0-dt(0))/864e5);
  const m={t0,idx,tot:0,dn:0,sc:{},sd:{},late:[],fullDays:0};
  for(const k in SB){m.sc[k]=0;m.sd[k]=0}
  T.forEach((ts,i)=>{ts.forEach(x=>{m.tot++;m.sc[x.s]++;if(S[x.id]){m.dn++;m.sd[x.s]++}else if(i<idx)m.late.push(Object.assign({d:i},x))});if(ts.length&&full(i))m.fullDays++});
  m.pc=m.tot?Math.round(m.dn/m.tot*100):0;
  m.left=Math.max(0,Math.round((new Date(2026,11,19)-t0)/864e5));
  let st=0;for(let i=Math.min(idx,LAST);i>=0;i--){if(!T[i].length)continue;if(full(i))st++;else if(i!==idx)break}
  m.st=st;m.best=Math.max(+gs("study-best","0"),st);P("study-best",String(m.best));
  m.fsTot=0;for(const k in FS)m.fsTot+=FS[k];
  m.fmTot=0;for(const k in FM)m.fmTot+=FM[k];
  m.fT=FS[dk(t0)]||0;
  m.chN=0;for(const k in CHD)m.chN+=CHD[k].length;
  m.xp=m.dn*10+m.fullDays*25+m.fsTot*15+m.chN*30;
  m.lvl=Math.floor(Math.sqrt(m.xp/60))+1;
  const a=60*(m.lvl-1)**2,b=60*m.lvl**2;m.xpPct=Math.round((m.xp-a)/(b-a)*100);m.xpNext=b-m.xp;
  LV.forEach(l=>{if(m.pc>=l[0])m.title=l[1]});
  const el=Math.min(Math.max(idx+1,1),N),rem=m.tot-m.dn,dl=Math.max(1,LAST-Math.max(idx,0)+1);
  m.rate=m.dn/el;m.need=Math.ceil(rem/dl);
  m.proj=m.rate>0?new Date(+dt(0)+Math.ceil(m.tot/m.rate)*864e5):null;
  return m;
}

function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}
function tone(f,t=0,d=.18,v=.12,type="sine"){const a=ac();if(!a||!CFG.snd)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t);g.gain.linearRampToValueAtTime(v,a.currentTime+t+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.05)}
const ping=p=>tone(520+p*5,0,.15);
const chime=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.35,.1,"triangle"));
function noise(type){const a=ac();if(!a)return null;const n=a.sampleRate*4,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(type==="brown"){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}const s=a.createBufferSource();s.buffer=b;s.loop=true;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=type==="rain"?1500:type==="brown"?700:9000;const g=a.createGain();g.gain.value=type==="white"?.04:type==="rain"?.13:.4;s.connect(f).connect(g).connect(a.destination);s.start();return s}

function planTimes(){
  const bl=PLN.blocks,r=[];let t=+atTime(PLN.start);
  if(PLN.started||+t<Date.now())t=Math.max(t,Date.now());
  const dn={};PLN.done.forEach(d=>dn[d.i]=d);
  let prevEnd=null;
  bl.forEach((b,i)=>{

    else if(i===PLN.cur){if(TM.run){e=TM.end;s=e-TM.dur*1e3}else{s=Math.max(prevEnd||0,Date.now(),PLN.started?0:+atTime(PLN.start));e=s+TM.rem*1e3}}

    r.push([s,e]);prevEnd=e;

}

/* ===== Timer ===== */
let TM=Object.assign({m:"w",rem:CFG.cw*60,dur:CFG.cw*60,end:0,run:false,n:0},J("study-timer",{}));
const blen=k=>planOn()?PLN.blocks[PLN.cur].m*60:(k==="w"?CFG.cw:k==="lb"?CFG.clb:CFG.cb)*60;
const tlen=()=>TM.dur||blen(TM.m);

const saveT=()=>P("study-timer",TM);

function tPause(){TM.rem=Math.max(0,Math.ceil((TM.end-Date.now())/1000));TM.run=false;saveT();tDraw()}

function tDone(skip){
  const was=TM.m,mins=Math.round(TM.dur/60),k=dk(day0()),cb=planOn()?PLN.blocks[PLN.cur]:null,subj=cb&&cb.k==="w"?cb.s:CFG.fsub;
  if(was==="w"){
    if(!skip){FS[k]=(FS[k]||0)+1;FM[subj]=(FM[subj]||0)+mins;FMD[k]=(FMD[k]||0)+mins;P("study-focus-day",FMD);if(new Date().getHours()>=23||new Date().getHours()<4)CFG.owl=1;save();chime();conf(40);notify("انتهت جلسة التركيز 🍅","وقت الاستراحة")}
    TM.n=(TM.n||0)+1;
  }
  let msg="";
  if(cb){
    PLN.done.push({i:PLN.cur,at:Date.now(),st:PLN.bst||null,skip:!!skip});PLN.cur++;PLN.bst=null;
    if(PLN.cur>=PLN.blocks.length){TM.run=false;TM.n=0;tSet("w");savePlan();saveT();render(true);planFinished();return}
    const nb=PLN.blocks[PLN.cur];tSet(nb.k);
    if(nb.k!=="w"||CFG.autoW)tStart();else TM.run=false;
    // finished the last session of a task? ask to tick it
    if(was==="w"&&cb.id&&!S[cb.id]&&!PLN.blocks.slice(PLN.cur).some(b=>b.id===cb.id))setTimeout(()=>toast("خلصت «"+cb.t+"»؟",null,["✓ علّمها منجزة",()=>markDone(cb.id)]),1500);
    if(was==="w"&&!skip)msg="🍅 جلسة رائعة! +15 XP — استراحة "+nb.m+" دقيقة";
    else if(nb.k==="w"&&!skip){msg="يلا الجلسة الجاية: "+nb.t;notify("انتهت الاستراحة","الجاية: "+nb.t)}
  }else{
    if(was==="w"){const L=TM.n%CFG.every===0;tSet(L?"lb":"b");tStart();if(!skip)msg="🍅 جلسة رائعة! +15 XP — "+(L?"استراحة طويلة ":"استراحة ")+Math.round(TM.dur/60)+" دقيقة"}
    else{tSet("w");if(CFG.autoW)tStart();else TM.run=false;if(!skip){msg="هيا نرجع للتركيز 💪";notify("انتهت الاستراحة","يلا نرجع للمذاكرة")}}
  }

  savePlan();saveT();render(true);
  if(!skip&&was==="w")petOn("focusDone");
  else if(!skip&&TM.m==="w"&&!TM.run&&cb)petOn("planNext");
}

  const [w,wp]=weakest(),out=[["➕ أضف مراجعة "+SB[w][0],"addrev:"+w]];
  let t=`💡 اقتراحي لك:<ul><li><b>${SB[w][0]}</b> أضعف مادة عندك (${wp}%)، أضف لها جلسة مراجعة سريعة اليوم.</li>`;
  const nx=EV.find(e=>e.d>new Date());if(nx&&(nx.d-new Date())/864e5<8){t+=`<li>${nx.n} قريب! حل تجميعات ${nx.x}.</li>`;out.push(["➕ حل تجميعات","addtj"])}
  if(!(NT[dk(day0())]||"").trim())t+="<li>اكتب ملاحظة اليوم: وش فهمت ووش ما فهمت 📝</li>";
  if(!M.fT)t+="<li>ولا جلسة تركيز اليوم، خلنا نسوي وحدة على الأقل ⏱</li>";
  return {t:t+"</ul>",a:out};
}
function rMotivate(){const n=esc(uname());return pick([`${n}، أنت أنجزت ${M.dn} مهمة لين الحين. هذا مو شي بسيط! كل مهمة تقربك من الدكتور اللي تبي تصيره 🩺`,`تخيل نفسك بعد الفاينل مرتاح وفخور… هذا الشعور يبدأ من مهمة وحدة الحين 🔥`,`ما يحتاج تكون متحمس، يحتاج تبدأ بس. 10 دقايق وبعدها قرر 😉`,`${Q[Math.floor(Math.random()*Q.length)]} 💪`])+"<br>"+(M.idx>=0&&M.idx<=LAST&&!full(M.idx)?"يلا وش رايك نبدأ جلسة؟":"")}
function rStress(){const k=dk(day0());return {t:`أفهمك يا ${esc(uname())} 🤍 الضغط طبيعي، ومعناه إنك تهتم.<br>خذ نفس معي: <b>شهيق 4 ثواني… احبسه 4… زفير 6</b> 🌬️ كررها 3 مرات.<br>بعدها نبدأ بخطوة صغيرة: <b>10 دقايق بس</b> على أسهل مهمة. اتفقنا؟`,a:[["⏱ 10 دقايق بس","focus:"],["✨ رتب المتأخر","rescue"]]}}
function rHow(){petDecay();return PET.food>70?pick(["أنا مرة تمام وشبعان 😋 شكرًا لأنك تنجز!","فل الفل! وأنت كيفك؟ 🦉"]):PET.food>30?"تمام الحمد لله… بس لو تخلص مهمة أكون أحسن 😄":"جوعاااان 😢 كل مهمة تخلصها = وجبة لي 🍎"}
function brain(raw,key){
  const s=nz(raw||""),n=esc(uname()),h=new Date().getHours();let m;
  if(!key){
    if(m=(raw||"").trim().match(/^(?:أضف|اضف|ضيف|زيد|سجل|سجّل|ذكرني)\s*[:،]?\s*(.{2,})/)){
      if(M.idx<0||M.idx>LAST)return "الجدول مو شغال الحين 🙃";
      addTask(M.idx,m[1],sub(m[1]),true);return {t:`سجلتها في مهام اليوم ✍️<br><b>${esc(m[1])}</b>`,a:[["📋 وش عندي اليوم؟","q:today"]]};
    }
    if(m=(raw||"").trim().match(/^(?:سميك|سمّيك|اسميك|اسمك صار|غير اسمك(?:\s*(?:الى|إلى|ل))?)\s+(.{1,20})/)){PET.name=m[1].trim();savePet();petStatus();return `حلو! من اليوم اسمي <b>${esc(PET.name)}</b> 🥰`}
    if(has(s,["خطه","خطتي","جلساتي","جدول اليوم","نظم","رتب يومي","رتب لي","كم جلسه","جلسات"]))key="plan";
    else key=has(s,["شكرا","يعطيك","مشكور","تسلم","thank","ثانكس"])?"thanks":has(s,["تعبان","تعب","طفشان","طفش","زهق","خايف","قلق","متوتر","توتر","ضغط","ما اقدر","مقدر","يائس","محبط"])?"stress":has(s,["متاخر","تاخر","فاتني","فاتت"])?"late":has(s,["بكره","بكرا","غدا"])?"tomorrow":has(s,["اضيف","اقترح","نصيحه","انصحني","وش ناقص","وش لازم"])?"suggest":has(s,["اذاكر","ابدا","وش اسوي","ايش اسوي","الحين"])?"next":has(s,["اليوم","وش عندي","مهامي","وش علي","ايش عندي","مهام"])?"today":has(s,["تقدم","ماشي","نسبه","مستواي","مستوي","احصا","كيف انا","وضعي","xp"])?"progress":has(s,["كويز","اختبار","فاينل","امتحان","متي"])?"exam":has(s,["ركز","تركيز","مؤقت","جلسه","بومودورو","تايمر"])?"focus":has(s,["حفز","تحفيز","شجع","ما ابي","مالي خلق","كسل","كسلان","ما لي خلق"])?"motivate":has(s,["نكته","ضحك","طقطق","نكت"])?"joke":has(s,["كيفك","شلونك","كيف حالك","وش اخبارك","علومك"])?"how":has(s,["اسمك","مين انت","من انت","وش انت"])?"name":has(s,["جوعان","اكل","طاقتك","جوع"])?"food":has(s,["نوم","انام","نعسان","سهران"])?"sleep":has(s,["هلا","مرحب","السلام","اهلا","هاي","hi","hello","صباح","مساء"])?"hello":has(s,["احبك","حبيبي","كفو","شاطر"])?"love":"";
  }
  PET.talk[dk(day0())]=(PET.talk[dk(day0())]||0)+1;savePet();
  switch(key){
    case"plan":return rPlan();
    case"today":return rToday();case"tomorrow":return rTomorrow();case"late":return rLate();case"next":return rNext();
    case"progress":return rProgress();case"exam":return rExam();case"suggest":return rSuggest();case"motivate":return rMotivate();
    case"stress":temp("love",3000);return rStress();
    case"joke":anim("wiggle");return pick(JOKES);
    case"focus":return {t:"جاهز؟ اختر المادة وأشغّل لك المؤقت ⏱",a:Object.keys(SB).map(k=>[SB[k][2]+" "+SB[k][0],"focus:"+k])};
    case"thanks":anim("wave");return pick(["العفو يا "+n+" 🤍 أنا هنا دايم","ولا يهمك! كمّل وأنا معك 💪"]);
    case"how":return rHow();
    case"name":return `أنا <b>${esc(PET.name)}</b> 🦉 بومتك الذكية! أرافقك لين الفاينل، أذكرك وأحفزك وأكبر معك: كل ما ارتفع مستواك أتطور (قبعة تخرج 🎓 ← سماعة طبيب 🩺 ← تاج 👑).<br>تبي تغير اسمي؟ اكتب: <b>سمّيك + الاسم</b>`;
    case"food":petDecay();return `طاقتي الحين <b>${Math.round(PET.food)}%</b> ${PET.food>60?"😋":"🥺"}<br>أكلي = إنجازك: كل مهمة 🍎 +10، يوم كامل +25، جلسة تركيز +15.`;
    case"sleep":return h>=23||h<5?"روح نم يا "+n+"! 😴 المخ يثبت المعلومات وقت النوم، والسهر يضيع اللي ذاكرته.":"النوم مهم، بس الحين وقت إنجاز 😄 خذ قيلولة 20 دقيقة إذا تحتاج.";
    case"hello":anim("wave");return `هلا والله يا ${n}! 👋 `+greetLine();
    case"love":temp("love",3000);anim("wiggle");fly("💜",0,4);return pick(["وأنا أحبك أكثر 💜 بس أحبك أكثر لما تخلص مهامك 😏","تسلم يا "+n+"! 🥰"]);
  }
  return {t:`ما فهمت عليك 😅 بس أقدر أساعدك في:<ul><li>وش عندي اليوم / بكرة</li><li>وش أذاكر الحين؟</li><li>المتأخر وخطة الإنقاذ</li><li>كيف مستواي؟ ومتى الكويز؟</li><li>اكتب «أضف + المهمة» وأسجلها لك</li></ul>`};
}
function rPlan(){
  if(planOn()){const bl=PLN.blocks,cb=bl[PLN.cur],tm=planTimes(),left=bl.slice(PLN.cur).filter(b=>b.k==="w");
    return {t:`🗓️ خطتك ماشية:<ul><li>${cb.k==="w"?"الحين: <b>"+esc(cb.t)+"</b>":"الحين استراحة ☕"}</li><li>باقي <b>${left.length}</b> جلسات (${durTxt(left.reduce((a,b)=>a+b.m,0))} مذاكرة)</li><li>تخلص تقريبًا الساعة <b>${hm12(new Date(tm[tm.length-1][1]))}</b></li></ul>`,a:[["⏱ صفحة التركيز","gofocus"]]}}
  if(planDoneToday())return "خلصت خطة اليوم 🏆 تبي خطة ثانية؟ روح لصفحة التركيز واضغط «خطة جديدة».";
  const u=M.idx>=0&&M.idx<=LAST?T[M.idx].filter(x=>!S[x.id]):[];
  if(!u.length)return "ما عندك مهام باقية اليوم 🎉 تقدر تسوي جلسات حرة من صفحة التركيز.";
  const tot=u.length*CFG.cw+Math.max(0,u.length-1)*CFG.cb;
  return {t:`أقدر أرتب لك يومك 🦉<br>عندك <b>${u.length}</b> مهام. لو جلسة لكل وحدة (${CFG.cw} د) مع استراحات، تحتاج تقريبًا <b>${durTxt(tot)}</b> وتخلص الساعة <b>${hm12(new Date(Date.now()+tot*6e4))}</b>.<br>تبيني أبدأها الحين؟ أو تخصصها بنفسك (الوقت وعدد الجلسات).`,a:[["⚡ رتّبها وابدأ الحين","autoplan"],["🛠 أخصصها بنفسي","toplanner"]]};
}
function greetLine(){
  if(M.idx<0)return "الجدول يبدأ قريب، جهّز نفسك!";if(M.idx>LAST)return "خلص الجدول، بالتوفيق في الفاينل 🎓";
  const r=T[M.idx].filter(x=>!S[x.id]).length;
  return r?`عندك اليوم ${r} ${r>2?"مهام":"مهمة"}${M.late.length?` و${M.late.length} متأخرة`:""}. اضغط علي ونسولف 🦉`:"خلصت مهام اليوم! أنت أسطورة 🏆";
}
function tip(){
  const n=uname(),h=new Date().getHours(),u=M.idx>=0&&M.idx<=LAST?T[M.idx].filter(x=>!S[x.id]):[],[w,wp]=weakest(),nx=EV.find(e=>e.d>new Date());
  const o=[];
  if(u.length)o.push(`يا ${n}، وش رايك تخلص «${u[0].t}»؟ 👀`,`باقي لك ${u.length} اليوم… جلسة وحدة وتخلص منها ⏱`);
  if(M.late.length)o.push(`عندك ${M.late.length} متأخرة، اضغط علي وأرتبها لك ✨`);
  if(PET.food<35)o.push("جوعان 🥺 خلص مهمة وأكلني 🍎");
  if(wp<M.pc)o.push(`${SB[w][0]} متأخرة شوي (${wp}%)، تبي تضيف لها مراجعة؟`);
  if(nx)o.push(`باقي ${Math.ceil((nx.d-new Date())/864e5)} يوم على ${nx.n} ⏳`);
  if(h>=0&&h<4)o.push("الوقت متأخر… النوم جزء من المذاكرة 😴");
  o.push("اشرب موية 💧 مخك 75% ماء!","عدّل جلستك وارفع راسك 🧘","تذكر: الاستمرار أهم من الكمال ✨");
  return pick(o);
}

/* chat */
const QUICK=[["🗓️ رتّب لي يومي","plan"],["📋 وش عندي اليوم؟","today"],["🎯 وش أذاكر الحين؟","next"],["⏰ المتأخر","late"],["📊 كيف مستواي؟","progress"],["💡 وش أضيف؟","suggest"],["⏳ متى الكويز؟","exam"],["🔥 حفزني","motivate"],["😮‍💨 متوتر","stress"],["😂 نكتة","joke"],["🤍 دلّعه","pet"]];
function msgHTML(m){return `<div class="msg${m.me?" me":""}">${m.t}${m.a&&m.a.length?'<div class="ma">'+m.a.map(a=>`<button data-pa="${esc(a[1])}">${a[0]}</button>`).join("")+"</div>":""}</div>`}
function drawChat(){$("#pcm").innerHTML=PET.hist.map(msgHTML).join("");$("#pqs").innerHTML=QUICK.map(q=>`<button data-pq="${q[1]}">${q[0]}</button>`).join("");$("#pcm").scrollTop=1e6;petStatus()}
function botMsg(r){
  const o=typeof r==="string"?{t:r}:r,box=$("#pcm");
  const ty=document.createElement("div");ty.className="msg typing";ty.innerHTML="<i></i><i></i><i></i>";box.appendChild(ty);box.scrollTop=1e6;pet.classList.add("talk");
  setTimeout(()=>{ty.remove();PET.hist.push({t:o.t,a:o.a||null});savePet();box.insertAdjacentHTML("beforeend",msgHTML(o));box.scrollTop=1e6;pet.classList.remove("talk")},450+Math.min(900,o.t.length*4));
}
function userSend(text,key){
  if(!text.trim())return;lastAct=Date.now();
  PET.hist.push({me:1,t:esc(text)});savePet();$("#pcm").insertAdjacentHTML("beforeend",msgHTML({me:1,t:esc(text)}));$("#pcm").scrollTop=1e6;
  if(key==="pet"){petOn("pet");return}
  const r=brain(text,key);botMsg(r);
  if((PET.talk[dk(day0())]||0)===3)setTimeout(()=>render(true),1500);
}
function openChat(){chatOpen=true;hideBub();$("#pchat").classList.add("on");drawChat();if(!PET.hist.length)botMsg({t:`هلا ${esc(uname())}! أنا <b>${esc(PET.name)}</b> 🦉 رفيقك لين الفاينل. ${greetLine()}`,a:[["📋 وش عندي اليوم؟","q:today"],["🎯 وش أذاكر؟","q:next"]]});anim("jump");if(matchMedia("(pointer:fine)").matches)setTimeout(()=>$("#pci").focus(),50)}
function closeChat(){chatOpen=false;$("#pchat").classList.remove("on")}
const PA={autoplan:()=>{closeChat();autoPlan()},toplanner:()=>{closeChat();go("focus");setTimeout(()=>{const e=$("#planner");if(e)e.scrollIntoView({block:"start",behavior:"smooth"})},80)},gofocus:()=>{closeChat();go("focus")},rescue:()=>{rescue()},lateToday:()=>{lateToday()},late:()=>{closeChat();tab="late";go("plan")},stats:()=>{closeChat();go("stats")},tomorrow:()=>botMsg(rTomorrow()),
  addtj:()=>{if(M.idx<0||M.idx>LAST)return;addTask(M.idx,"حل تجميعات قبل الكويز","ch",true);botMsg("أضفتها لمهام اليوم ✅")}};
function petAction(a){
  if(a.startsWith("q:")){const q=QUICK.find(x=>x[1]===a.slice(2));return userSend(q?q[0]:a.slice(2),a.slice(2))}
  if(a.startsWith("focus:")){const s=a.slice(6);if(s)CFG.fsub=s;save();closeChat();if(!TM.run&&!planOn()){TM.m="w";TM.dur=s?blen("w"):600;TM.rem=TM.dur}go("focus");if(!TM.run)tStart();return}
  if(a.startsWith("addrev:")){const s=a.slice(7);if(M.idx<0||M.idx>LAST)return;addTask(M.idx,"مراجعة سريعة: "+SB[s][0],s,true);return botMsg("أضفت «مراجعة سريعة: "+SB[s][0]+"» لمهام اليوم ✅ بالتوفيق!")}
  (PA[a]||(()=>{}))();
}

/* daily challenges */
const CHL=[
 {id:"f2",t:"سوّ جلستين تركيز",ok:()=>M.fT>=2},
 {id:"all",t:"خلّص كل مهام اليوم",ok:()=>M.idx>=0&&M.idx<=LAST&&T[M.idx].length&&full(M.idx)},
 {id:"note",t:"اكتب ملاحظة اليوم",ok:()=>!!(NT[dk(day0())]||"").trim()},
 {id:"mood",t:"سجّل مزاجك اليوم",ok:()=>MD[dk(day0())]!==undefined},
 {id:"chat",t:()=>"سولف مع "+PET.name+" 3 مرات",ok:()=>(PET.talk[dk(day0())]||0)>=3},
 {id:"nolate",t:"صفّر المهام المتأخرة",ok:()=>!M.late.length},
 {id:"f1",t:"جلسة تركيز وحدة على الأقل",ok:()=>M.fT>=1},
 {id:"tm",t:"أنجز مهمة من بكرة مقدمًا",ok:()=>M.idx>=0&&M.idx<LAST&&T[M.idx+1].some(x=>S[x.id])}];
function todayCh(){if(M.idx<0||M.idx>LAST)return[];const i=M.idx*3;return [CHL[i%8],CHL[(i+3)%8],CHL[(i+5)%8]]}
function checkCh(){
  const k=dk(day0()),done=CHD[k]=CHD[k]||[],nw=todayCh().filter(c=>c.ok()&&!done.includes(c.id));
  if(!nw.length)return;nw.forEach(c=>done.push(c.id));P("study-ch",CHD);
  setTimeout(()=>{toast("🎯 تحدي مكتمل: "+(typeof nw[0].t==="function"?nw[0].t():nw[0].t)+" +30 XP");conf(50);petOn("challenge");render(true)},900);
}
function vChallenges(){
  const cs=todayCh();if(!cs.length)return "";const k=dk(day0()),done=CHD[k]||[];
  return `<section class="card"><div class="ch2"><h2>🎯 تحديات اليوم</h2><span class="pill">${cs.filter(c=>done.includes(c.id)).length} / ${cs.length}</span></div>${cs.map(c=>`<div class="chl${done.includes(c.id)?" ok":""}"><span class="ck">✓</span><span>${typeof c.t==="function"?esc(c.t()):c.t}</span><em>+30 XP</em></div>`).join("")}
  <div class="pcard" style="margin-top:12px"><div class="pav" data-x="pchat">🦉</div><div><b>${esc(PET.name)}</b> <span class="pill">${STG[stage()]}</span><p class="mu" style="margin:2px 0">كل ما ارتفع مستواك يتطور رفيقك. سولف معه، بيقولك وش عندك ووش تضيف 💬</p></div></div></section>`;
}

/* pet events */
pet.addEventListener("click",()=>{
  const n=Date.now();clicks=clicks.filter(t=>n-t<1500);clicks.push(n);
  if(clicks.length>=5){clicks=[];petOn("dizzy");return}
  if(sleeping){sleeping=false;petExpr();anim("jump");say(pick(["ها؟! كنت مغمض عيوني بس 😳","صحّيتني! يلا نكمل 💪"]),1);return}
  chatOpen?closeChat():openChat();
});
pet.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();chatOpen?closeChat():openChat()}});
pbub.addEventListener("click",openChat);
$("#pcf").addEventListener("submit",e=>{e.preventDefault();e.stopPropagation();const v=$("#pci").value;$("#pci").value="";userSend(v)});
/* eyes follow the pointer */
let mx=0,my=0,rf=0;
function setPupils(x,y){psv.querySelectorAll(".pp").forEach(p=>p.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`)}
function look(){rf=0;const r=pet.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.45,dx=mx-cx,dy=my-cy,d=Math.hypot(dx,dy)||1,k=Math.min(3.5,d/50);setPupils(dx/d*k,dy/d*k)}
function wake(){lastAct=Date.now();if(sleeping){sleeping=false;petExpr();if(!chatOpen&&Math.random()<.5)say(pick(["ها؟! كنت مغمض عيوني بس 😳","صحيت! يلا نكمل 💪","أهلين! رجعت؟ 🦉"]))}}
document.addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;wake();if(!rf)rf=requestAnimationFrame(look)},{passive:true});
document.addEventListener("keydown",wake);
/* life loop: idle moves, sleep, tips */
setInterval(()=>{
  const n=Date.now();
  if(planOn()&&!PLN.started&&!TM.run&&!PLN.rem&&n>=+atTime(PLN.start)){PLN.rem=1;savePlan();notify("حان وقت خطتك ⏰","الجلسة الأولى: "+(PLN.blocks.find(b=>b.k==="w")||{}).t);toast("⏰ حان وقت أول جلسة!",null,["▶️ ابدأ",()=>{go("focus");tStart()}]);tone(880,0,.3);sleeping=false;say("حان الوقت! ⏰ أول جلسة: "+(PLN.blocks.find(b=>b.k==="w")||{}).t,1);anim("jump")}
  if(!CFG.pet)return;
  if(!sleeping&&!TM.run&&n-lastAct>180000){sleeping=true;hideBub();petExpr()}
  if(sleeping||tmpE)return;
  const r=Math.random();
  if(r<.12)anim(pick(["wave","tilt","wiggle"]));
  else if(r<.3){setPupils(Math.random()*7-3.5,Math.random()*5-2.5);setTimeout(look,1300)}
  if(CFG.petTalk&&!chatOpen&&!TM.run&&document.visibilityState==="visible"&&n-lastSay>240000&&n-lastAct<60000){say(tip());anim("wave")}
},7000);
setInterval(()=>{petDecay();savePet();petStatus();petExpr()},60000);

/* hook companion into the app */
const _render=render;render=function(keep){_render(keep);petExpr();checkCh()};
const _tStart=tStart;tStart=function(){const w=TM.m==="w"&&!TM.run;_tStart();if(w)petOn("focusStart")};

if(TM.run&&TM.end<=Date.now())TM.rem=0;
render();petStatus();
setTimeout(()=>{const h=new Date().getHours(),gr=h<5?"سهران؟":h<12?"صباح الخير":h<18?"هلا":"مساء الخير";anim("jump");say(`${gr} يا ${uname()}! 👋 ${greetLine()}`,1)},1200);
</script>
