<head>

<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--bg2:#e8ecf5;--card:#fff;--tx:#121a2e;--mu:#68748c;--ln:#e2e7f0;--h1:#0f1a35;--h2:#1e2f5c;--ac:#c9a24f;--ok:#1fa597;--bad:#d4573f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#070d1a;--bg2:#101a2e;--card:#0f1829;--tx:#e8edf7;--mu:#8e9bb5;--ln:#1e2a44;--h1:#0c1630;--h2:#1a2a52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Readex Pro",Tahoma,system-ui,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:760px;margin:auto;padding:0 16px 120px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.brand{flex:1;font:700 21px "El Messiri",serif}
.tb{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--card);cursor:pointer;font-size:17px}
.hero{color:#f3efe6;border-radius:26px;padding:20px;margin-bottom:14px;background:radial-gradient(110% 80% at 100% 0%,color-mix(in srgb,var(--ac) 38%,transparent),transparent 55%),linear-gradient(160deg,var(--h1),var(--h2))}
.hg{display:flex;align-items:center;gap:14px}.hl{flex:1;min-width:0}
.gr{font-size:14px;opacity:.8}
#nm{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.3);color:#fff;font:700 26px "El Messiri",serif;width:100%;outline:0;padding:0}
.lv{display:inline-block;font-size:12.5px;color:#14213d;background:var(--ac);border-radius:20px;padding:0 12px;font-weight:700;margin-top:6px}
.xp{height:7px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:8px;overflow:hidden}.xp i{display:block;height:100%;background:var(--ac);transition:width .5s}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.st div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 2px;text-align:center;font-size:11.5px}
.st b{display:block;font-size:21px;color:var(--ac);line-height:1.4}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
h2{font:700 19px "El Messiri",serif;margin:0}
.pill{font-size:12.5px;font-weight:700;border-radius:20px;padding:0 10px;background:var(--bg2);color:var(--mu);white-space:nowrap}
.mu{color:var(--mu);font-size:14px;margin:4px 0}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:12px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.pr{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}.btn.sm{padding:3px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.g2 .card{margin:0}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{text-align:center;border-radius:14px;padding:6px 0;background:var(--bg2);font-size:12px;color:var(--mu)}
.cd b{display:block;font-size:24px;color:var(--ac);font-variant-numeric:tabular-nums}

.mb{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-bottom:6px}.mb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .4s}
.tk{display:flex;align-items:center;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,transparent);margin:6px 0;border-inline-start:4px solid var(--c)}

.tk input{position:absolute;opacity:0;pointer-events:none}
.cb{width:23px;height:23px;border-radius:8px;border:2px solid var(--c);flex:none;display:grid;place-items:center;background:var(--card)}
.tk input:checked+.cb{background:var(--c)}
.tk input:checked+.cb::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tk input:focus-visible+.cb{outline:2px solid var(--ac);outline-offset:2px}
.tk.dn .tt{text-decoration:line-through;color:var(--mu)}
.tk.fl{box-shadow:inset 0 0 0 1px var(--bad)}
.tt{overflow-wrap:anywhere}
.mvd{font-size:11px;color:var(--mu);background:var(--bg2);border-radius:8px;padding:0 6px;margin-inline-start:4px}

.ib{width:30px;height:30px;border-radius:10px;border:0;background:transparent;cursor:pointer;font-size:15px;color:var(--mu)}
.tk.fl .ib[data-fl]{opacity:1;filter:none}.ib[data-fl]{filter:grayscale(1);opacity:.55}.tk.fl .ib[data-fl]{filter:none}
.add{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.inp,.add input,.add select{border:1px solid var(--ln);border-radius:12px;background:var(--bg);padding:8px 12px;font-size:14px;outline:0;min-width:0}
.add input{flex:1;min-width:140px}

textarea{width:100%;min-height:70px;margin-top:10px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);padding:10px 12px;resize:vertical;outline:0;font-size:14px}
.mood{display:flex;gap:4px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--mu);flex-wrap:wrap}

.mood button.on{filter:none;opacity:1;border-color:var(--ac)}
.warn{border-color:var(--bad)}
.srch{display:flex;border:1px solid var(--ln);border-radius:14px;background:var(--card);padding:0 12px;margin-bottom:10px}

.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}

.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}

.seg button.on{background:var(--card);color:var(--tx);font-weight:700}
.wk{margin:20px 4px 8px;font:700 17px "El Messiri",serif;color:var(--ac)}
.day{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:10px 12px;margin-bottom:10px;scroll-margin-top:70px}
.day.today{border:2px solid var(--ac)}.day.done{opacity:.65}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}.dh span{color:var(--mu);font-weight:400;font-size:13px}
.tag{font-size:11px;border-radius:8px;padding:0 7px;margin-inline-start:6px;background:var(--bad);color:#fff}.tag.t{background:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:26px 0}
.sub4{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px;color:var(--mu)}
@media(max-width:520px){.sub4{grid-template-columns:repeat(3,1fr)}}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hm span{font-size:11px;text-align:center;color:var(--mu)}
.hm>i{aspect-ratio:1;border-radius:7px;background:var(--bg2);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--mu);cursor:pointer}
.hm>i.l1{background:color-mix(in srgb,var(--ok) 30%,var(--bg2))}.hm>i.l2{background:color-mix(in srgb,var(--ok) 60%,var(--bg2));color:#fff}.hm>i.l3{background:var(--ok);color:#fff}
.hm>i.td{outline:2px solid var(--ac);outline-offset:1px}.hm>i.fu{opacity:.45}
.sb{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:8px 0}.sb span:first-child{width:92px;flex:none}
.bar{flex:1;height:9px;background:var(--bg2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bd div{text-align:center;font-size:11.5px;padding:8px 2px;border-radius:14px;border:1px solid var(--ln);color:var(--mu);filter:grayscale(1);opacity:.45}
.bd div.on{opacity:1;filter:none;color:var(--tx);border-color:var(--ac)}.bd b{display:block;font-size:22px}
.big{font:700 28px "Readex Pro",sans-serif;color:var(--ac);line-height:1.3}
.fc{text-align:center}
.tring{position:relative;width:min(280px,76vw);margin:10px auto}.tring svg{width:100%;display:block}
.tring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#tmT{font:700 clamp(44px,14vw,60px) "Readex Pro",sans-serif;font-variant-numeric:tabular-nums;line-height:1.1}
#tmR{transition:stroke-dashoffset .3s linear}
.ctl{display:flex;gap:10px;justify-content:center;margin:6px 0}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0;text-align:start}
.pf label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mu)}
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(14px);border:1px solid var(--ln);box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;border:0;background:transparent;color:var(--mu);border-radius:16px;padding:6px 12px;cursor:pointer;font-size:11.5px;min-width:64px}
.nav button.on{background:var(--tx);color:var(--bg)}.nav b{font-size:18px;line-height:1.3}
#mini{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;z-index:25;display:none;border-radius:20px;border:1px solid var(--ac);background:var(--card);padding:2px 12px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}#mini.on{display:block}
#ts{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw;font-size:14px}
#ts.on{opacity:1;pointer-events:auto}#ts button{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:2px 12px;cursor:pointer}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.5);display:none;align-items:flex-start;justify-content:center;padding:70px 14px 14px}.ov.on{display:flex}
.pnl{width:100%;max-width:520px;background:var(--card);border:1px solid var(--ln);border-radius:22px;max-height:calc(100vh - 90px);overflow:auto;padding:18px}
.pnl h3{font-size:14px;margin:16px 0 8px;color:var(--mu)}.pnl h3:first-child{margin-top:0}
.sw{display:flex;gap:10px}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);cursor:pointer}.sw button.on{outline:2px solid var(--tx)}
.fx{position:fixed;top:-16px;z-index:80;pointer-events:none;animation:fl linear forwards}@keyframes fl{to{transform:translateY(108vh) rotate(720deg);opacity:.3}}

@keyframes up{from{opacity:0;transform:translate(var(--dx,0),18px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}}
@keyframes fl2{50%{transform:scale(1.18) rotate(5deg)}}
@keyframes pulse{70%{box-shadow:0 0 0 22px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flo{50%{transform:translateY(-6px) rotate(-6deg)}}
@keyframes orb{50%{transform:translate(30px,-40px) scale(1.2)}}
@keyframes gw{from{width:0!important}}
@keyframes fd{from{opacity:0}}
#app.f{--dx:-30px}#app.b{--dx:30px}
#app.in>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
#app.in>*:nth-child(2){animation-delay:.07s}#app.in>*:nth-child(3){animation-delay:.14s}#app.in>*:nth-child(4){animation-delay:.21s}#app.in>*:nth-child(5){animation-delay:.28s}#app.in>*:nth-child(n+6){animation-delay:.35s}
.card{transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px -16px rgba(0,0,0,.4)}
.btn,.tb,.nav button{transition:transform .15s,background .3s,color .3s}.btn:active,.tb:active,.nav button:active{transform:scale(.94)}
.nav button.on b{animation:pop .4s}
.tt>i{color:var(--c);margin-inline-end:4px}.tk.fl .ib[data-fl]{color:var(--bad)}
.sr{display:flex;align-items:baseline;gap:8px}.sr b{font:700 46px "El Messiri",serif;color:var(--ac);line-height:1}.sr span{color:var(--mu)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0;text-align:center}
.wd div{border-radius:14px;padding:7px 0;background:var(--bg2);color:var(--mu);display:flex;flex-direction:column;gap:2px;font-size:14px}.wd small{font-size:10.5px}
.wd div.on{background:color-mix(in srgb,var(--ac) 22%,var(--bg2));color:var(--ac);animation:pop .5s calc(.07s*var(--i)) both}.wd div.on i{animation:fl2 1.6s ease-in-out infinite}.wd div.td{outline:2px solid var(--ac)}
.fire{color:#f0803c;animation:fl2 1.6s ease-in-out infinite;display:inline-block}
.ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.ev:last-child{border:0}.ev>i{color:var(--ac);width:22px;text-align:center}.ev div{flex:1}.ev small{display:block;color:var(--mu);font-size:12px}
.ob{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,var(--h1),var(--h2));color:#f3efe6;overflow:auto;text-align:center}
.ob.on{display:flex;animation:fd .5s both}
.orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.4;pointer-events:none;background:var(--ac);animation:orb 9s ease-in-out infinite}
.o1{width:260px;height:260px;top:-60px;right:-60px}.o2{width:220px;height:220px;bottom:-50px;left:-60px;background:#4f8cff;animation-delay:-3s}.o3{width:150px;height:150px;top:45%;left:30%;background:#e0567c;animation-delay:-6s;opacity:.22}
.obc{position:relative;max-width:480px;width:100%}.obc>*{animation:up .6s cubic-bezier(.2,.8,.2,1) both}.obc>*:nth-child(2){animation-delay:.1s}.obc>*:nth-child(3){animation-delay:.2s}.obc>*:nth-child(n+4){animation-delay:.3s}
.obc h1{font:700 27px "El Messiri",serif;margin:8px 0}.obc p{opacity:.85;margin:6px 0 14px}
.obi{width:92px;height:92px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);animation:pulse 2.4s infinite!important}
.hat{font-size:40px;color:var(--ac);animation:flo 3s ease-in-out infinite}
.ob .inp{width:100%;text-align:center;font-size:16px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25);margin:4px 0}.ob .inp::placeholder{color:rgba(255,255,255,.55)}
.ob .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}.ob .btn.pr{background:var(--ac);border-color:var(--ac)}
.obl>div{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:13.5px;animation:up .6s both;animation-delay:calc(.15s*var(--i))}.obl .bar{flex:1;background:rgba(255,255,255,.14)}.obl .bar i{background:var(--ac);animation:gw 1s .4s both}.obl span{width:112px;text-align:start;flex:none}
.chs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}.chs span{border:1px solid var(--c);border-radius:20px;padding:0 10px;font-size:12.5px}
.mt{display:flex;gap:10px;align-items:center;text-align:start;margin:8px 0;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.mt>i{font-size:20px;color:var(--ac);width:26px;text-align:center}
.odots{display:flex;gap:6px;margin-top:18px}.odots i{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.3);transition:.3s}.odots i.on{width:26px;background:var(--ac)}
.obb{display:flex;gap:10px;margin-top:16px;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes sh{to{background-position:-200% 0}}@keyframes flipin{from{transform:rotateY(90deg);opacity:0}}
body{background:radial-gradient(900px 420px at 100% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),radial-gradient(700px 400px at 0% 30%,color-mix(in srgb,var(--ok) 8%,transparent),transparent),var(--bg);background-attachment:fixed}

.xp i{background:linear-gradient(90deg,var(--ac),#fff9,var(--ac))!important;background-size:200% 100%;animation:sh 2.5s linear infinite}

.nav button{min-width:56px;padding:6px 8px}

.tp.ok{border-color:var(--ok)}.tp.ok input{text-decoration:line-through;color:var(--mu)}

.dq{font:600 18px "El Messiri",serif;color:var(--ac);margin:8px 0;line-height:1.9}
.wk4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;color:var(--mu)}.wk4 b{display:block;font:700 21px "Readex Pro",sans-serif;color:var(--ac)}

 if(i===1)return planStep();
 if(i===2){const W2=WK.map((w,k)=>{const a=w[0],b=k<WK.length-1?WK[k+1][0]:N;let c=0;for(let j=a;j<b;j++)c+=all(j).length;return [w[1].split("·")[0],c]}),mx=Math.max(1,...W2.map(x=>x[1]));
  return `<div class="obi"><i class="fas fa-calendar-days hat"></i></div><h1>جدولك باختصار</h1><p>${N} يوم و${M.tot} مهمة، موزعة على الصباح والعصر والليل.</p><div class="obl">${W2.map((x,k)=>`<div style="--i:${k}"><span>${x[0]}</span><div class="bar"><i style="width:${x[1]/mx*100}%"></i></div><small>${x[1]}</small></div>`).join("")}</div><div class="chs">${Object.keys(SB).filter(k=>M.sc[k]).map(k=>`<span style="--c:${SB[k][1]}">${SB[k][2]} ${SB[k][0]}</span>`).join("")}</div>`}
 if(i===3){const n=new Date(),E=events().filter(e=>e.d>n),s=Math.max(M.idx,0),D=[];for(let j=s;j<Math.min(N,s+3);j++)D.push(j);
  return `<div class="obi"><i class="fas fa-bell hat"></i></div><h1>مواعيد الكويزات القادمة</h1><div class="obl">${E.map((e,k)=>`<div style="--i:${k}"><span style="width:auto;flex:1"><b>${e.n}</b><br><small>${DN[e.d.getDay()]} ${fmt(e.d)}</small></span><b>${Math.ceil((e.d-n)/864e5)} يوم</b></div>`).join("")}</div><p>أيامك الجاية:</p><div class="obl">${D.map((j,k)=>`<div style="--i:${k+2}"><span style="width:92px"><b>${DN[dt(j).getDay()]}</b> ${fmt(dt(j))}</span><small style="flex:1;text-align:start">${all(j).slice(0,2).map(x=>esc(x.t)).join(" · ")||"مراجعة حرة"}</small></div>`).join("")}</div>`}
 return `<div class="obi"><i class="fas fa-rocket hat"></i></div><h1>ليش تجتهد؟</h1><div class="mt"><i class="fas fa-fire"></i><span>اجتهد الحين، تعبك مؤقت وفرحتك تبقى.</span></div><div class="mt"><i class="fas fa-heart"></i><span>فرّح أهلك، لحظة نجاحك تستاهل كل ساعة.</span></div><div class="mt"><i class="fas fa-star"></i><span>حلمك قريب، وكل مهمة تنجزها خطوة له.</span></div><input id="obd" class="inp" maxlength="90" placeholder="اكتب حلمك (اختياري)" value="${esc(CFG.dream)}">`}
function obDraw(){$("#obc").innerHTML=obView(obi);$("#obd2").innerHTML=[0,1,2,3,4].map(i=>`<i class="${i===obi?"on":""}"></i>`).join("");$("#obb").innerHTML=(obi?'<button class="btn" data-x="obp"><i class="fas fa-arrow-right"></i> رجوع</button>':'<button class="btn" data-x="obf">تخطي</button>')+(obi<4?'<button class="btn pr" data-x="obn">التالي <i class="fas fa-arrow-left"></i></button>':'<button class="btn pr" data-x="obf">ابدأ رحلتي <i class="fas fa-rocket"></i></button>')}
function obShow(){obi=(()=>{try{return +sessionStorage.getItem("f26ob")||0}catch(e){return 0}})();try{sessionStorage.removeItem("f26ob")}catch(e){}$("#ob").innerHTML='<i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><div class="obc" id="obc"></div><div class="odots" id="obd2"></div><div class="obb" id="obb"></div>';$("#ob").classList.add("on");obDraw()}
function obSave(){const a=$("#obn"),b=$("#obd");if(a)CFG.name=a.value.trim();if(b)CFG.dream=b.value.trim();save()}
function obGo(n){obSave();if(n>0&&obi===1){if(!pick){toast("اختر خطتك أولًا");return}try{localStorage.setItem("f26plan",pick)}catch(e){}if(pick!==PL){try{sessionStorage.setItem("f26ob","2")}catch(e){}location.reload();return}}obi=Math.max(0,Math.min(4,obi+n));obDraw()}
function obFin(){obSave();CFG.ob=1;save();$("#ob").classList.remove("on");go("home");conf(80);chime();toast((CFG.name?"يلا يا "+CFG.name+"، ":"")+"ابدأ أول مهمة وثبّت ستريكك")}
/* ===== الأحداث ===== */
document.addEventListener("change",e=>{
  const t=e.target,id=t.dataset&&t.dataset.id;
  if(t.id==="nm"){CFG.name=t.value.trim();save();toast(CFG.name?"أهلًا بك يا "+CFG.name+"":"تم الحفظ");return}
  if(t.id==="jr"){const k=dk(day0());EX.jr[k]=t.value.trim();if(EX.jr[k])ST[k]=1;save();toast("حفظت يومياتك");return}
  if(t.id==="rmt"){CFG.rem=t.value;save();try{Notification.requestPermission()}catch(e){}toast("حفظت وقت التذكير");return}
  if(t.id==="cce"||t.id==="ccw"||t.id==="cct"){CFG.cc={e:$("#cce").value,w:$("#ccw").value||40,t:$("#cct").value||90};save();render(true);return}
  if(t.id==="tpi"){const k=dk(day0()),o=EX.tp[k]=EX.tp[k]||{t:"",d:0};o.t=t.value.trim();save();toast("حفظت مهمتك الأهم");return}
  if(t.id==="lt"){CFG.letter=t.value.trim();save();toast("حفظت رسالتك");return}
  if(t.id==="dm"){CFG.dream=t.value.trim();save();toast("تم حفظ حلمك");return}
  if(t.id==="nt"){NT[dk(day0())]=t.value;save();toast("تم حفظ الملاحظة");return}
  if(t.id==="sq"&&t.value){CFG.quiz=t.value;save();render(true);return}
  if(t.id==="sg"){CFG.goal=Math.max(10,Math.min(900,+t.value||120));save();render(true);return}
  if(t.id==="sw"||t.id==="sbk"){const k=t.id==="sw"?"w":"b";CFG[k]=Math.max(1,Math.min(k==="w"?180:60,Math.round(+t.value)||CFG[k]));save();if(!TM.run)tReset();render(true);return}
  if(t.id==="ssn"){CFG.snd=t.checked?1:0;save();return}
  if(t.id==="upf"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{importData(JSON.parse(r.result));closeOv()}catch(er){toast("الملف غير صالح")}};r.readAsText(t.files[0]);t.value="";return}
  if(!id)return;
  const i=+t.dataset.d,was=full(i),s=snap();
  if(t.checked){S[id]=1;ST[dk(day0())]=1}else delete S[id];save();render(true);
  if(t.checked){if(!was&&full(i)){chime();conf();toast("أنجزت يومك كامل، كفو!",s)}else{tone(520+M.pc*4,0,.15);toast("+10 XP",s)}}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.trim();$("#list").innerHTML=planList()}});
document.addEventListener("submit",e=>{if(e.target.id==="rwf"){e.preventDefault();const t=$("#rwt").value.trim(),x=+$("#rwx").value;if(t&&x>0){EX.rw.push([t,x]);EX.rw.sort((a,b)=>a[1]-b[1]);save();render(true)}return}
if(e.target.id==="mkf"){e.preventDefault();const t=$("#mkt").value.trim();if(t){EX.mk.unshift({s:$("#mks").value,t});save();render(true);toast("سجّلت الخطأ")}return}if(e.target.id==="fcf"){e.preventDefault();const q=$("#fcq").value.trim(),a=$("#fca").value.trim();if(q&&a){EX.fc.push({q,a});fi=EX.fc.length-1;ff=0;save();render(true);toast("أضفت البطاقة")}return}if(e.target.id==="addf"){e.preventDefault();addTask(+e.target.dataset.d,$("#addt").value,$("#adds").value,$("#addk").value)}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-jump],.ov");if(!b)return;
  if(b.classList.contains("ov")){if(e.target===b)closeOv();return}
  const ds=b.dataset;
  if(ds.v){go(ds.v);return}
  if(ds.jump!==undefined){jump(+ds.jump);return}
  if(ds.f!==undefined){flt=ds.f;render(true);return}
  if(ds.tab){tab=ds.tab;render(true);return}
  if(ds.mood!==undefined){const k=dk(day0()),v=+ds.mood;MD[k]===v?delete MD[k]:MD[k]=v;save();render(true);return}
  if(ds.fl){F[ds.fl]?delete F[ds.fl]:F[ds.fl]=1;save();render(true);toast(F[ds.fl]?"أضفتها لقائمة المراجعة":"أزلت العلامة");return}
  if(ds.mv){const s=snap(),i=+ds.d,to=Math.min(LAST,Math.max(i,M.idx)+1);move(ds.mv,i,to);save();render(true);toast("تأجّلت إلى "+DN[dt(to).getDay()]+" "+fmt(dt(to)),s);return}
  if(ds.del){const s=snap(),i=+ds.d;C[i]=(C[i]||[]).filter(c=>c.id!==ds.del);delete S[ds.del];save();render(true);toast("تم الحذف",s);return}
  if(ds.addday!==undefined){const t=prompt("اكتب المهمة الجديدة ليوم "+fmt(dt(+ds.addday)));if(t)addTask(+ds.addday,t,"gn",0);return}
  if(ds.pk){pick=ds.pk;document.querySelectorAll(".pcard").forEach(b=>b.classList.toggle("on",b.dataset.pk===pick));return}
  if(ds.plan){if(ds.plan!==PL&&confirm("تبديل الخطة؟ لكل خطة تقدمها المنفصل.")){try{localStorage.setItem("f26plan",ds.plan)}catch(e){}location.reload()}return}
  if(ds.rw!==undefined){EX.rw.splice(+ds.rw,1);save();render(true);return}
  if(ds.mk!==undefined){EX.mk.splice(+ds.mk,1);ST[dk(day0())]=1;save();render(true);toast("ممتاز، أتقنتها");return}
  if(ds.cf){const a=ds.cf.split(",");EX.cf[a[0]]=+a[1];save();render(true);return}
  if(ds.hb){const k=dk(day0()),h=EX.hb[k]=EX.hb[k]||{};if(h[ds.hb])delete h[ds.hb];else{h[ds.hb]=1;ST[k]=1}save();render(true);if(Object.keys(h).length>=4){conf(40);chime();toast("أكملت عادات اليوم")}return}
  if(ds.nz!==undefined){noise(+ds.nz);render(true);return}
  if(ds.pre){const p=ds.pre.split(",").map(Number);CFG.w=p[0];CFG.b=p[1];save();tReset();render(true);return}
  if(ds.fs){TM.sub=ds.fs;saveT();render(true);return}
  if(ds.acc){CFG.acc=ds.acc;save();applyTheme();openSet();render(true);return}
  if(ds.th!==undefined){CFG.theme=ds.th;save();applyTheme();openSet();return}
  const x=ds.x;if(!x)return;
  ({set:openSet,close:closeOv,
    th:()=>{CFG.theme=document.documentElement.getAttribute("data-theme")==="dark"||(!CFG.theme&&matchMedia("(prefers-color-scheme:dark)").matches)?"light":"dark";save();applyTheme()},
    qt:()=>{qi++;render(true)},prt:()=>window.print(),qzs:()=>{QZ={o:EX.fc.map((_,i)=>i).sort(()=>Math.random()-.5),i:0,ok:0,r:0};render(true)},qzr:()=>{QZ.r=1;render(true)},qzy:()=>{QZ.ok++;QZ.i++;QZ.r=0;if(QZ.i>=QZ.o.length){ST[dk(day0())]=1;save();conf(40);chime()}render(true)},qzn:()=>{QZ.i++;QZ.r=0;render(true)},qzx:()=>{QZ=null;render(true)},zen:()=>document.body.classList.toggle("zen"),flip:()=>{ff=!ff;render(true)},fn:()=>{fi=(fi+1)%EX.fc.length;ff=0;render(true)},fp:()=>{fi=(fi-1+EX.fc.length)%EX.fc.length;ff=0;render(true)},fsh:()=>{fi=Math.floor(Math.random()*EX.fc.length);ff=0;render(true)},fdel:()=>{EX.fc.splice(fi,1);fi=0;ff=0;save();render(true)},
    tpd:()=>{const k=dk(day0()),o=EX.tp[k]=EX.tp[k]||{t:"",d:0};if(!o.t){toast("اكتب مهمتك أولًا");return}o.d=o.d?0:1;if(o.d){ST[k]=1;conf(30);chime()}save();render(true)},
    chl:()=>{const k=dk(day0());EX.ch[k]=1;ST[k]=1;save();render(true);conf(50);chime();toast("تحدي اليوم تم! +20 XP")},
    shr:()=>{const t="رحلتي نحو الفاينل: "+M.pc+"% إنجاز، ستريك "+dstreak()+" يوم، المستوى "+M.lvl+"، تركيز "+durTxt(M.fmT);if(navigator.share)navigator.share({text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t);toast("نسخت تقدمك")}catch(e){toast(t)}}},obn:()=>obGo(1),obp:()=>obGo(-1),obf:obFin,tour:()=>{closeOv();obShow()},chk:()=>{ST[dk(day0())]=1;save();render(true);conf();chime();toast("ثبّتّ ستريك "+dstreak()+" يوم")},rescue,lateToday,seeLate:()=>{tab="late";go("plan")},
    tgo:()=>TM.run?tPause():tStart(),trs:tReset,tsk:()=>tDone(true),
    dl,up:()=>$("#upf").click(),
    unmv:()=>{if(!confirm("ترجع كل المهام المؤجلة لأيامها الأصلية؟"))return;const s=snap();MV={};save();render(true);toast("رجعت كل المهام لأماكنها",s)},
    rs:()=>{if(confirm("مسح كل علامات الإنجاز؟")){const s=snap();S={};save();render(true);toast("تم المسح",s)}}
  }[x]||(()=>{}))();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOv();if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$("#ob").classList.contains("on"))return;if(e.key==="ArrowLeft")nav(1);if(e.key==="ArrowRight")nav(-1)});
let lastDay=dk(day0());setInterval(()=>{if(dk(day0())!==lastDay){lastDay=dk(day0());render(true)}},60000);
if(TM.run&&TM.end<=Date.now())TM.rem=0;
ANIM=1;$("#app").className="in f";render();setTimeout(()=>$("#app").className="",1000);const _pc=$("#plcur");if(_pc)_pc.textContent="الحالية: "+PL;const _rm=$("#rmt");if(_rm)_rm.value=CFG.rem||"";if(!CFG.ob)setTimeout(obShow,300);
</script>
