<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطة المذاكرة للفاينل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f2;--card:#fff;--tx:#10272a;--mu:#5a7073;--ln:#dbe5e4;--ac:#12806b;--hero:#0c3b3f;--bad:#c2452d;--ch:#3b82f6;--md:#e5476f;--en:#f59e0b;--sk:#8b5cf6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1517;--card:#122124;--tx:#e8f2f1;--mu:#8aa5a7;--ln:#213538;--ac:#3fcfb0;--hero:#0a2a2e}}
:root[data-theme="dark"]{--bg:#0b1517;--card:#122124;--tx:#e8f2f1;--mu:#8aa5a7;--ln:#213538;--ac:#3fcfb0;--hero:#0a2a2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,system-ui,sans-serif;line-height:1.65}
.w{max-width:680px;margin:auto;padding:0 14px 90px}
.hero{background:var(--hero);color:#fff;border-radius:0 0 26px 26px;padding:22px 18px 18px;margin:0 -14px 14px}
.hr{display:flex;align-items:center;gap:16px}
.hr>div{flex:1}
.hero small{opacity:.75;font-size:13px}
.hero input{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.4);color:#fff;font:inherit;font-size:20px;font-weight:800;width:100%;padding:2px 0;outline:0}
.hero input::placeholder{color:rgba(255,255,255,.55)}
.q{margin:8px 0 0;font-size:13px;opacity:.85}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px;text-align:center;font-size:12px}
.st b{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}
.sb{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.sb span:first-child{width:92px;flex:none}
.bar{flex:1;height:8px;background:var(--ln);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.sb em{width:38px;text-align:left;font-style:normal;color:var(--mu)}
.ex{display:flex;gap:8px}
.ex div{flex:1;border-radius:12px;padding:10px;font-size:13px;color:#fff}
.ex b{display:block;font-size:14px}
.chips,.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chips button,.tabs button,.ft button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chips button.on,.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs button{flex:1;border-radius:10px}
.wk{margin:20px 0 8px;font-weight:800;font-size:14px;color:var(--ac)}
.note{display:inline-block;margin-top:3px;font-size:12px;background:#f2b441;color:#2a1d00;padding:1px 10px;border-radius:12px}
.day{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.day.today{border:2px solid var(--ac)}
.day.done{opacity:.6}
.dh{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:4px}
.dh span{color:var(--mu);font-weight:400;font-size:13px}
.late .dh b{color:var(--bad)}
label{display:flex;gap:10px;align-items:flex-start;padding:8px 8px 8px 0;margin:4px 0;cursor:pointer;font-size:15px;border-inline-start:4px solid var(--c);padding-inline-start:10px;border-radius:4px;background:color-mix(in srgb,var(--c) 7%,transparent)}
input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--c);flex:none}
input:checked+span{text-decoration:line-through;color:var(--mu)}
.ft{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
#ts{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ac);color:#fff;padding:10px 20px;border-radius:24px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:30}
#ts.on{opacity:1;transform:translateX(-50%)}
#pf{position:fixed;bottom:16px;left:16px;z-index:20}
#pb{width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 14px #0004}
#pp{display:none;position:absolute;bottom:62px;left:0;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;width:210px;text-align:center}
#pp.on{display:block}
#pt{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}
#pp button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;margin:2px;cursor:pointer}
@media print{.noprint,#pf,#ts{display:none!important}.hero{color:#000;background:none}.day{break-inside:avoid}}
</style>
</head>
<body>
<div class="w"><div id="app"></div></div>
<div id="ts"></div>
<div id="pf" class="noprint"><div id="pp"><small id="pm">وقت التركيز</small><div id="pt">25:00</div><button id="ps">ابدأ</button><button id="pr">إعادة</button></div><button id="pb" aria-label="مؤقت التركيز">⏱</button></div>
<script>
var D=[
["كيمياء: Chapter 6","حل التجميعات","كيمياء: Chapter 7 (Lecture 1)"],["English"],["كيمياء: Chapter 7 (Lecture 1+2)"],["مهارات اتصال: مراجعة + دراسة محاضرة جديدة"],
["كيمياء: مراجعة كاملة لجزئية الميد من الملخصات","مراجعة شابتر 6 / 7","English"],["مبادئ طبية: Chapter 8","English"],
["English","مبادئ طبية: Chapter 9 (إضافة محاضرة)"],["كيمياء: تسمية (Chapter 8، Lecture 1)","حل التجميعات"],["English"],["كيمياء: تفاعلات (Chapter 8، Lecture 2)","حل التجميعات"],
["مهارات اتصال: مراجعة + دراسة محاضرة جديدة"],["كيمياء: مراجعة كاملة لجزئية الميد من الملخصات","مراجعة شابتر 6 / 7 / 8 (التركيز على العضوية)","English"],["مبادئ طبية: Chapter 10","English"],
["English"],["كيمياء: Chapter 9","حل التجميعات"],["English"],["كيمياء: تفاعلات (Chapter 10، Lecture 1)","حل التجميعات"],["مهارات اتصال: مراجعة + دراسة محاضرة جديدة"],
["كيمياء: مراجعة كاملة لجزئية الميد من الملخصات","مراجعة شابتر 6 / 7 / 8 / 9","English"],["مبادئ طبية: Chapter 11","English"],
["English"],["كيمياء: تفاعلات (Chapter 10، Lecture 2)","حل التجميعات"],["English"],["كيمياء: تسمية (Chapter 11، Lecture 1)","كيمياء: Chapter 11 (Lecture 2) علشان الإجازة","حل التجميعات"],
["مهارات اتصال: مراجعة + دراسة محاضرة جديدة"],["كيمياء: Chapter 12 (آخر شابتر بالمادة)","English"],["مبادئ طبية: Chapter 12 + Chapter 13 (آخر شابتر بالمنهج)","English"],
["English"],["كيمياء: مراجعة فاينل (1) Chapter 6 / 7"],["English"],["كيمياء: مراجعة فاينل (2) Chapter 8 / 9"],["مهارات اتصال: مراجعة + دراسة محاضرة جديدة"],
["كيمياء: مراجعة فاينل Chapter 6 / 7 / 8 / 9","English"],["مبادئ طبية: مراجعة فاينل Chapter 8 / 9 / 10 / 11","English"],
["English"],["كيمياء: مراجعة فاينل (4) Chapter 10"],["English"],["كيمياء: مراجعة فاينل (5) Chapter 11 / 12"],["مهارات اتصال: مراجعة + دراسة محاضرة جديدة"],
["كيمياء: مراجعة فاينل شاملة (6) — حل تجميعات الفاينل","English"],["مبادئ طبية: مراجعة فاينل Chapter 12 / 13","English"],
["English"],["كيمياء: مراجعة فاينل (7)"],["English"],["كيمياء: مراجعة فاينل (8)"],["مهارات اتصال: مراجعة + دراسة محاضرة جديدة"],
["كيمياء: مراجعة فاينل شاملة (9) — حل تجميعات الفاينل","English"],["مبادئ طبية: مراجعة فاينل Chapter 12 / 13","English"]];
var W={0:["الأسبوع 1: 2 إلى 7 نوفمبر",""],6:["الأسبوع 2: 8 إلى 14 نوفمبر",""],13:["الأسبوع 3: 15 إلى 21 نوفمبر","كويز الكيمياء: Chapter 6 + 7"],20:["الأسبوع 4: 22 إلى 28 نوفمبر","إجازة الخريف"],27:["الأسبوع 5: 29 نوفمبر إلى 5 ديسمبر","كويز مبادئ طبية: Chapter 9 + 10"],34:["الأسبوع 6: 6 إلى 12 ديسمبر",""],41:["الأسبوع 7: 13 إلى 19 ديسمبر","آخر أسبوع قبل الفاينل"]};
var SB={ch:["الكيمياء","var(--ch)"],md:["مبادئ طبية","var(--md)"],en:["English","var(--en)"],sk:["مهارات اتصال","var(--sk)"]};
var DN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var Q=["خطوة اليوم أسهل من تراكم الأسبوع.","المذاكرة المنتظمة أقوى من ليلة الاختبار.","أنجز مهمة واحدة الآن وابدأ.","التكرار أساس الإتقان.","الراحة جزء من الخطة، لا تهملها.","كل صح تضعه يقربك من الفاينل.","ثق بالخطة وكمل."];
function g(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function p(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S={};try{S=JSON.parse(g("study-final-2026","{}"))}catch(e){}
var all=false,flt="",NAME=g("study-name","");
if(g("study-theme","")){document.documentElement.setAttribute("data-theme",g("study-theme",""))}
function sub(t){return /^(كيمياء|حل|مراجعة)/.test(t)?"ch":/^مبادئ/.test(t)?"md":/^مهارات/.test(t)?"sk":"en"}
function dt(i){return new Date(2026,10,2+i)}
function day0(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function full(i){return D[i].every(function(_,j){return S[i+"_"+j]})}
function toast(m){var t=document.getElementById("ts");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},2400)}
function row(i,j,t){var id=i+"_"+j;return '<label style="--c:'+SB[sub(t)][1]+'"><input type="checkbox" data-id="'+id+'"'+(S[id]?' checked':'')+'><span>'+t+'</span></label>'}
function render(){
var t0=day0(),idx=Math.round((t0-dt(0))/864e5),tot=0,dn=0,sc={},sd={},h="";
for(var k in SB){sc[k]=0;sd[k]=0}
D.forEach(function(ts,i){ts.forEach(function(t,j){var s=sub(t);tot++;sc[s]++;if(S[i+"_"+j]){dn++;sd[s]++}})});
var pc=Math.round(dn/tot*100),left=Math.max(0,Math.round((new Date(2026,11,19)-t0)/864e5)),st=0;
for(var i=Math.min(idx,47);i>=0;i--){if(full(i))st++;else if(i!==idx)break}
h+='<div class="hero"><div class="hr"><div><small>'+DN[t0.getDay()]+' '+t0.getDate()+' '+MN[t0.getMonth()]+'</small><input id="nm" placeholder="اكتب اسمك" value="'+NAME.replace(/"/g,"")+'" aria-label="الاسم"><p class="q">'+Q[t0.getDate()%Q.length]+'</p></div>';
h+='<svg viewBox="0 0 120 120" width="112" height="112"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="'+(326.7*(1-pc/100)).toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">'+pc+'%</text></svg></div>';
h+='<div class="st"><div><b>'+dn+'/'+tot+'</b>مهمة منجزة</div><div><b>'+st+'</b>أيام متتالية</div><div><b>'+left+'</b>يوم لنهاية الجدول</div></div></div>';
h+='<div class="card"><h2>تقدمك في كل مادة</h2>';
for(k in SB){var q=Math.round(sd[k]/sc[k]*100);h+='<div class="sb"><span>'+SB[k][0]+'</span><div class="bar"><i style="width:'+q+'%;background:'+SB[k][1]+'"></i></div><em>'+q+'%</em></div>'}
h+='</div>';
function ds(a,b){var n=Math.round((new Date(2026,a,b)-t0)/864e5);return n>0?'يبدأ بعد '+n+' يوم':n>-7?'هذا الأسبوع':'انتهى'}
h+='<div class="ex"><div style="background:var(--ch)"><b>كويز الكيمياء</b>15 إلى 21 نوفمبر<br>Chapter 6 + 7<br>'+ds(10,15)+'</div><div style="background:var(--md)"><b>كويز مبادئ طبية</b>29 نوفمبر إلى 5 ديسمبر<br>Chapter 9 + 10<br>'+ds(10,29)+'</div></div>';
if(idx>=0&&idx<=47){h+='<div class="card" style="margin-top:12px"><h2>مهام اليوم</h2>'+D[idx].map(function(t,j){return row(idx,j,t)}).join("")+'</div>'}
else h+='<div class="card" style="margin-top:12px">'+(idx<0?'الجدول يبدأ يوم 2 نوفمبر.':'انتهى الجدول. بالتوفيق في الفاينل!')+'</div>';
h+='<div class="chips noprint"><button data-f=""'+(flt?'':' class="on"')+'>كل المواد</button>';
for(k in SB)h+='<button data-f="'+k+'"'+(flt===k?' class="on"':'')+'>'+SB[k][0]+'</button>';
h+='</div><div class="tabs noprint"><button data-a="0"'+(all?'':' class="on"')+'>القادم</button><button data-a="1"'+(all?' class="on"':'')+'>الجدول كامل</button></div>';
var any=false;
D.forEach(function(ts,i){
var d=dt(i),past=d<t0,isT=i===idx,fin=full(i);
if(!all&&(past&&fin||isT))return;
if(!all&&past&&!fin){}
var rows=ts.map(function(t,j){return !flt||sub(t)===flt?row(i,j,t):""}).join("");
if(!rows)return;any=true;
if(W[i]&&(all||dt(i+6)>=t0)){h+='<div class="wk">'+W[i][0]+(W[i][1]?'<br><span class="note">'+W[i][1]+'</span>':'')+'</div>'}
h+='<div class="day'+(isT?' today':'')+(fin?' done':'')+(past&&!fin?' late':'')+'"><div class="dh"><b>'+DN[d.getDay()]+(past&&!fin?' (متأخر)':'')+'</b><span>'+d.getDate()+' '+MN[d.getMonth()]+'</span></div>'+rows+'</div>'});
if(!any)h+='<p style="text-align:center;color:var(--mu)">لا توجد مهام هنا. جرّب «الجدول كامل».</p>';
h+='<div class="ft noprint"><button data-x="sh">مشاركة</button><button data-x="pr">طباعة</button><button data-x="th">الوضع الليلي / النهاري</button><button data-x="rs">مسح العلامات</button></div>';
document.getElementById("app").innerHTML=h}
document.addEventListener("change",function(e){
var id=e.target.getAttribute&&e.target.getAttribute("data-id");
if(e.target.id==="nm"){NAME=e.target.value.trim();p("study-name",NAME);toast(NAME?"أهلاً "+NAME:"تم");return}
if(!id)return;var i=+id.split("_")[0],was=full(i);
if(e.target.checked)S[id]=1;else delete S[id];
p("study-final-2026",JSON.stringify(S));
var y=scrollY,n=0;render();scrollTo(0,y);
if(!was&&full(i))toast("أنجزت اليوم كاملًا 🎉");
D.forEach(function(_,k){n+=full(k)?1:0});if(n===D.length)toast("خلصت الخطة كاملة، ألف مبروك! 🏆")});
document.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.hasAttribute("data-f")){flt=b.getAttribute("data-f");render()}
else if(b.hasAttribute("data-a")){all=b.getAttribute("data-a")==="1";render();scrollTo(0,0)}
else{var x=b.getAttribute("data-x");
if(x==="rs"&&confirm("مسح كل العلامات؟")){S={};p("study-final-2026","{}");render()}
if(x==="pr")print();
if(x==="th"){var r=document.documentElement,c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=c==="dark"?"light":"dark";r.setAttribute("data-theme",n);p("study-theme",n)}
if(x==="sh"){var u=location.href,m="جدول مذاكرة الفاينل";
if(navigator.share)navigator.share({title:m,text:m,url:u}).catch(function(){});
else if(navigator.clipboard){navigator.clipboard.writeText(u);toast("تم نسخ الرابط")}}}});
var T={m:"w",t:1500,id:0};
function pdraw(){var s=T.t;document.getElementById("pt").textContent=("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2);document.getElementById("pm").textContent=T.m==="w"?"وقت التركيز":"استراحة"}
document.getElementById("pb").onclick=function(){document.getElementById("pp").classList.toggle("on")};
document.getElementById("pr").onclick=function(){clearInterval(T.id);T.id=0;T.m="w";T.t=1500;document.getElementById("ps").textContent="ابدأ";pdraw()};
document.getElementById("ps").onclick=function(){
if(T.id){clearInterval(T.id);T.id=0;this.textContent="استكمل";return}
this.textContent="إيقاف";
T.id=setInterval(function(){T.t--;if(T.t<=0){T.m=T.m==="w"?"b":"w";T.t=T.m==="w"?1500:300;if(navigator.vibrate)navigator.vibrate(400);toast(T.m==="b"?"أحسنت! خذ استراحة 5 دقائق":"يلا نرجع للتركيز")}pdraw()},1000)};
render();
</script>
</body>
</html>
