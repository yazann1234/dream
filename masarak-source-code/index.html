<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111a35">
<meta name="description" content="منصة مذاكرة تفاعلية لتنظيم خطة الفاينل ومتابعة الإنجاز والتركيز.">
<title>مسارك للفاينل | خطة المذاكرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">✦</div>
    <div><div class="brand-name">مسارك للفاينل</div><div class="brand-sub">خطتك، إنجازك، وهدفك في مكان واحد</div></div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" data-action="theme" title="تغيير المظهر">◐</button>
    <button class="icon-btn" data-action="export" title="تصدير نسخة احتياطية">⇩ <span class="label-hide">نسخة احتياطية</span></button>
    <button class="icon-btn" data-action="print" title="طباعة الجدول">⎙ <span class="label-hide">طباعة</span></button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="side-label">مساحة المذاكرة</div>
    <nav class="nav-list" aria-label="التنقل الرئيسي">
      <button class="nav-btn active" data-view="home"><span class="nav-icon">⌂</span>نظرة عامة</button>
      <button class="nav-btn" data-view="schedule"><span class="nav-icon">▦</span>جدول المذاكرة</button>
      <button class="nav-btn" data-view="focus"><span class="nav-icon">◷</span>جلسة التركيز</button>
      <button class="nav-btn" data-view="stats"><span class="nav-icon">▥</span>إحصائياتي</button>
    </nav>
    <div class="sidebar-tip">
      <b>خطوة صغيرة كل يوم ✨</b>
      <p>لا تحتاج تنجز كل شيء دفعة واحدة. ابدأ بالمهمة التالية فقط.</p>
    </div>
  </aside>

  <main id="app" aria-live="polite"></main>
</div>

<nav class="mobile-nav" aria-label="التنقل">
  <button class="nav-btn active" data-view="home"><span class="nav-icon">⌂</span>الرئيسية</button>
  <button class="nav-btn" data-view="schedule"><span class="nav-icon">▦</span>الجدول</button>
  <button class="nav-btn" data-view="focus"><span class="nav-icon">◷</span>التركيز</button>
  <button class="nav-btn" data-view="stats"><span class="nav-icon">▥</span>إنجازاتي</button>
</nav>

<div class="mini-timer" id="miniTimer"><i></i><span id="miniTimerText">25:00</span><span>جلسة تركيز</span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="app.js" defer></script>
</body>
</html>
